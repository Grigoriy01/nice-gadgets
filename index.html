<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/nice-gadgets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/nice-gadgets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/nice-gadgets/favicon-16x16.png" />
    <link rel="manifest" href="/nice-gadgets/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0 viewport-fit=cover"
    />
    <title>Nice Gadgets Store</title>
    <!-- Synchronous script for immediate theme application before React rendering. -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('app_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/nice-gadgets/assets/index-CYBOup-j.js"></script>
    <link rel="stylesheet" crossorigin href="/nice-gadgets/assets/index-D6rsVYVr.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
